<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Desfecho da Jornada - Dra. Débora</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=700&family=Lora:ital,wght=1,400&family=Dancing+Script:wght=600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ouro-velho: #8c6d31;
            --sepia-escuro: #2b1d04;
            --prata: #e2e8f0;
            --incandescente: #ff9d00;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'Lora', serif;
        }

        /* Camada das estrelas geradas por JS */
        #cosmos {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .estrela {
            position: absolute;
            border-radius: 50%;
            animation: brilhar var(--d) infinite ease-in-out;
        }

        @keyframes brilhar {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); filter: blur(1px); }
        }

        /* Container que centraliza o painel artístico */
        .container-principal {
            display: flex;
            width: 100vw;
            height: 100vh;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 3;
            background: linear-gradient(180deg, rgba(2,6,23,0.5) 0%, rgba(10,5,2,0.7) 100%);
        }

        /* O Painel que une a imagem realista e o texto */
        .painel-artistico {
            width: 90%;
            max-width: 1100px;
            height: 80vh;
            max-height: 650px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(140, 109, 49, 0.3);
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.5);
            display: flex;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        /* Lado Esquerdo: A Arte Realista da Mente Psiquiátrica e Coração */
        .area-imagem {
            flex: 1.3;
            background-image: url('brain_heart_art.jpg'); /* Nome do arquivo que você vai salvar */
            background-size: cover;
            background-position: center;
            position: relative;
            border-right: 1px solid rgba(140, 109, 49, 0.2);
        }

        /* Degradê suave sobre a imagem para integrar com o lado do texto */
        .area-imagem::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent 75%, rgba(10, 15, 30, 0.95) 100%);
        }

        /* Lado Direito: O texto poético */
        .conteudo-texto {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #f1f5f9;
            text-align: right;
            background: rgba(10, 15, 30, 0.85);
        }

        .mensagem {
            font-family: 'Dancing Script', cursive;
            font-size: 1.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #f3e8ff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .destaque-voce {
            font-family: 'Cinzel', serif;
            font-size: 2.6rem;
            color: #ff4d4d;
            display: block;
            margin-top: 15px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
        }

        .assinatura {
            margin-top: 40px;
            border-top: 1px solid rgba(241, 245, 249, 0.1);
            padding-top: 20px;
            font-style: italic;
            font-size: 1rem;
            color: var(--ouro-velho);
            opacity: 0.9;
        }

        /* Responsividade para Celulares */
        @media (max-width: 900px) {
            .painel-artistico { flex-direction: column; height: auto; max-height: none; }
            .area-imagem { height: 350px; border-right: none; border-bottom: 1px solid rgba(140, 109, 49, 0.2); }
            .area-imagem::after { background: linear-gradient(180deg, transparent 60%, rgba(10, 15, 30, 0.95) 100%); }
            .conteudo-texto { text-align: center; padding: 30px; }
        }
    </style>
</head>
<body>

    <div id="cosmos"></div>

    <div class="container-principal">
        <div class="painel-artistico">
            
            <div class="area-imagem"></div>

            <div class="conteudo-texto">
                <p class="mensagem">
                    "Por mais que nem sempre possamos ter exatamente o que queremos, que saibamos apreciar a beleza da jornada e dar sempre o nosso melhor para quem é especial..."
                </p>
                <span class="mensagem">E nesse momento...</span>
                <span class="destaque-voce">É VOCÊ.</span>
                
                <div class="assinatura">
                    Com carinho, do fundo da alma e da história.
                </div>
            </div>

        </div>
    </div>

    <script>
        const cosmos = document.getElementById('cosmos');
        const fragmento = document.createDocumentFragment();

        // Gerador do céu estrelado dinâmico
        for (let i = 0; i < 130; i++) {
            const estrela = document.createElement('div');
            estrela.className = 'estrela';
            
            const isHot = Math.random() > 0.75; // Mistura entre estrelas frias (prata) e quentes (incandescentes)
            estrela.style.background = isHot ? '#ff9d00' : '#e2e8f0';
            if(isHot) estrela.style.boxShadow = '0 0 10px #ff9d00, 0 0 4px #ff5500';
            else estrela.style.boxShadow = '0 0 6px #e2e8f0';
            
            const tamanho = Math.random() * 2.5 + 0.5;
            estrela.style.width = tamanho + 'px';
            estrela.style.height = tamanho + 'px';
            
            estrela.style.top = Math.random() * 100 + '%';
            estrela.style.left = Math.random() * 100 + '%';
            
            estrela.style.setProperty('--d', (Math.random() * 4 + 2) + 's');
            
            fragmento.appendChild(estrela);
        }
        cosmos.appendChild(fragmento);
    </script>
</body>
</html>
